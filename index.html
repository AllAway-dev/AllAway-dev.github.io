<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>max</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .youtube-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .youtube-bg iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 177.78vh;
            height: 100vh;
            border: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.75);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 16px;
            font-size: 2.2rem;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        @media (prefers-reduced-motion: reduce) {
            .youtube-bg { display: none; }
        }

        @media (max-aspect-ratio: 16/9) {
            .youtube-bg iframe {
                width: 100vw;
                height: 56.25vw;
            }
        }
    </style>
</head>
<body>
    <div class="youtube-bg" aria-hidden="true">
        <iframe
            src="https://www.youtube.com/embed/XJkfA0Wgj7g?autoplay=1&mute=1&loop=1&controls=0&rel=0&playlist=XJkfA0Wgj7g&modestbranding=1&iv_load_policy=3"
            title="Background video"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
    </div>

    <div class="container">
        <h1>Hoş geldiniz</h1>
        <p>Siteye hoş geldiniz — iletişime geçmek için butona tıklayın.</p>
        <a href="#" class="btn">İletişime Geç</a>
    </div>
</body>
</html>
