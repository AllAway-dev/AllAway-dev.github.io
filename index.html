<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>max</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* kenarlardaki boş alanlar tamamen siyah olsun */
            color: #f8fafc;
            display: block;
            min-height: 100vh;
            text-align: center;
            padding: 0;
            overflow: hidden;
        }

        .youtube-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #000;
            overflow: hidden;
            pointer-events: none;
        }

        .youtube-bg iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* kenarlarda boşluk kalmaması için en azını tam kapla */
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            border: 0;
        }

        /* Konuşma balonu kaldırıldı - içerik yok */

        /* Erişilebilirlik: reduced-motion tercih eden kullanıcılar için video arkaplanını gizle */
        @media (prefers-reduced-motion: reduce) {
            .youtube-bg { display: none; }
        }

    </style>
</head>
<body>
    <div class="youtube-bg" aria-hidden="true">
        <iframe
            src="https://www.youtube.com/embed/XJkfA0Wgj7g?autoplay=1&mute=1&loop=1&controls=0&rel=0&playlist=XJkfA0Wgj7g&modestbranding=1&iv_load_policy=3"
            title="Background video"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
    </div>
</body>
</html>
