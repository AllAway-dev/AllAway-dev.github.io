<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>max</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* fallback */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden; /* video taşmalarını gizle */
        }

        /* Video arkaplan */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1; /* içerik elementlerinin arkasında kalsın */
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            background: rgba(30,41,59,0.75); /* şeffaf arka plan, okunurluk için */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 16px;
            font-size: 2.2rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        /* Erişilebilirlik: kullanıcı "reduced motion" tercih ederse videoyu kapat */
        @media (prefers-reduced-motion: reduce) {
            .video-bg { display: none; }
        }
    </style>
</head>
<body>
    <!-- Arka plan video: uploads ettiğiniz dosyaların yollarına göre güncelleyin (videos/bg.webm / videos/bg.mp4) -->
    <video id="bg-video" class="video-bg" autoplay muted loop playsinline poster="videos/poster.jpg">
        <source src="videos/bg.webm" type="video/webm">
        <source src="videos/bg.mp4" type="video/mp4">
        <!-- Eğer tarayıcı video desteklemiyorsa poster/resim gösterilecek -->
    </video>

    <div class="container">
        <h1>verstappen</h1>
        <p>çok büyük adam</p>
        <a href="#" class="btn">ocon için 10 saniye penaltı</a>
    </div>

    <script>
      // Eğer kullanıcı reduced-motion tercih etmişse videoyu durdur
      (function(){
        const vid = document.getElementById('bg-video');
        if (!vid) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          vid.pause();
          vid.removeAttribute('autoplay');
        }
      })();
    </script>
</body>
</html>
